<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Portfolio CMS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 15% 20%, hsla(250, 95%, 68%, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, hsla(280, 85%, 60%, 0.1) 0%, transparent 45%);
        }

        .login-card {
            width: min(440px, calc(100vw - 2rem));
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 2.25rem 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            position: relative;
            z-index: 10;
            margin: auto;
            box-sizing: border-box;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo-wrap {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            position: relative;
        }

        @keyframes square-animation {
         0% { left: 0; top: 0; }
         10.5% { left: 0; top: 0; }
         12.5% { left: 32px; top: 0; }
         23% { left: 32px; top: 0; }
         25% { left: 64px; top: 0; }
         35.5% { left: 64px; top: 0; }
         37.5% { left: 64px; top: 32px; }
         48% { left: 64px; top: 32px; }
         50% { left: 32px; top: 32px; }
         60.5% { left: 32px; top: 32px; }
         62.5% { left: 32px; top: 64px; }
         73% { left: 32px; top: 64px; }
         75% { left: 0; top: 64px; }
         85.5% { left: 0; top: 64px; }
         87.5% { left: 0; top: 32px; }
         98% { left: 0; top: 32px; }
         100% { left: 0; top: 0; }
        }

        .loader {
         position: relative;
         width: 96px;
         height: 96px;
         transform: scale(0.42) rotate(45deg);
         transform-origin: center center;
        }

        .loader-square {
         position: absolute;
         top: 0;
         left: 0;
         width: 28px;
         height: 28px;
         margin: 2px;
         border-radius: 4px;
         background: linear-gradient(135deg, var(--accent, #6366f1), hsl(280, 85%, 65%));
         box-shadow: 0 0 10px hsla(250, 95%, 68%, 0.4);
         animation: square-animation 10s ease-in-out infinite both;
        }

        .loader-square:nth-of-type(0) { animation-delay: 0s; }
        .loader-square:nth-of-type(1) { animation-delay: -1.4285714286s; }
        .loader-square:nth-of-type(2) { animation-delay: -2.8571428571s; }
        .loader-square:nth-of-type(3) { animation-delay: -4.2857142857s; }
        .loader-square:nth-of-type(4) { animation-delay: -5.7142857143s; }
        .loader-square:nth-of-type(5) { animation-delay: -7.1428571429s; }
        .loader-square:nth-of-type(6) { animation-delay: -8.5714285714s; }
        .loader-square:nth-of-type(7) { animation-delay: -10s; }
        .login-title {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .login-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }
        .form-input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: border-color var(--transition-fast);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, var(--accent), hsl(280, 85%, 60%));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity var(--transition-fast);
            margin-top: 0.5rem;
        }
        .btn-login:hover { opacity: 0.92; }

        .error-alert {
            background: hsla(0, 70%, 50%, 0.1);
            border: 1px solid hsla(0, 70%, 50%, 0.3);
            color: hsl(0, 70%, 65%);
            padding: 0.65rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
        }
        .back-link:hover { color: var(--text-primary); }
    </style>
</head>
<body>
    <div class="bg-canvas"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo-wrap">
                <div class="loader">
                    <div class="loader-square"></div>
                    <div class="loader-square"></div>
                    <div class="loader-square"></div>
                    <div class="loader-square"></div>
                    <div class="loader-square"></div>
                    <div class="loader-square"></div>
                    <div class="loader-square"></div>
                </div>
            </div>
            <h1 class="login-title">Admin Sign In</h1>
            <p class="login-sub">Enter credentials to access Portfolio CMS</p>
        </div>

        <div class="error-alert" id="error-alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-input" type="email" id="email" value="admin@portfolio.com" required placeholder="admin@portfolio.com">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" value="Admin@123" required placeholder="••••••••">
            </div>
            <button class="btn-login" type="submit" id="btn-submit">Sign In</button>
        </form>

        <a href="../../public/pages/index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Public Portfolio
        </a>
    </div>

    <script src="../../utils/api.js"></script>
    <script>
        (() => {
            const { Auth, AuthAPI } = window.API;

            if (Auth.isLoggedIn()) {
                window.location.href = './dashboard.html';
                return;
            }

            const form      = document.getElementById('login-form');
            const alert     = document.getElementById('error-alert');
            const submitBtn = document.getElementById('btn-submit');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alert.style.display = 'none';

                const email    = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                submitBtn.disabled    = true;
                submitBtn.textContent = 'Signing in…';

                try {
                    const res  = await AuthAPI.login({ email, password });
                    const data = res?.data;
                    const token = data?.accessToken || data?.token;
                    if (token) {
                        Auth.setSession(token, { email: data.email, fullName: data.fullName, role: data.role || 'Admin' });
                        window.location.href = './dashboard.html';
                    } else {
                        throw new Error('Invalid response payload');
                    }
                } catch (err) {
                    alert.textContent   = err.message || 'Login failed. Please check your credentials.';
                    alert.style.display = 'block';
                } finally {
                    submitBtn.disabled    = false;
                    submitBtn.textContent = 'Sign In';
                }
            });
        })();
    </script>
</body>
</html>
